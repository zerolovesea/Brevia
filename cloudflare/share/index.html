<!doctype html>
<html lang="en"
  ><head
    ><meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    /><meta name="robots" content="noindex,nofollow" /><title>Brevia</title>
    <link rel="icon" type="image/svg+xml" href="/brevia-mark.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/design-layout.css" /><link
      rel="stylesheet"
      href="/desktop-shell.css"
    /><link rel="stylesheet" href="/desktop-workspace.css" /><link
      rel="stylesheet"
      href="/viewer.css"
    />
    <script defer src="/i18n-data.js"></script
    ><script defer src="/app-utils.js"></script
    ><script defer src="/ui-components.js"></script
    ><script defer src="/meeting-evidence.js"></script
    ><script defer src="/marked.js"></script>
    <script defer src="/purify.js"></script>
    <script defer src="/viewer.js"></script> </head
  ><body
    ><main id="detail-view" class="shared-document"
      ><header
        ><a href="https://brevia.work" class="shared-brand"
          ><img src="/brevia-logo.svg" width="110" height="35" alt="Brevia" /></a
        ><details id="language" class="shared-language"
          ><summary aria-label="Interface language"></summary
          ><div class="shared-language-options"></div></details></header
      ><h1 id="title">Brevia</h1
      ><div class="shared-information"
        ><div id="meeting-meta" class="shared-meta"></div
        ><div id="participants" class="shared-participants" role="group" hidden></div
        ><div class="shared-statistics"><time id="expiry"></time><span id="views"></span></div></div
      ><p id="status" role="status">Loading…</p
      ><form id="unlock" hidden
        ><label id="password-label" for="password">Password</label
        ><input
          id="password"
          type="password"
          maxlength="128"
          required
          autocomplete="current-password"
        /><button type="submit">Open</button></form
      >
      <nav id="tabs" aria-label="Document" hidden></nav
      ><section id="content" tabindex="-1"></section></main
    ><div id="quote-preview" class="shared-quote-preview" role="tooltip" hidden
      ><strong></strong><p></p></div></body
></html>
