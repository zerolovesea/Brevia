<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Brevia - 言录</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./workspace-styles.css" />
  </head>
  <body>
    <div class="startup-splash" id="startup-splash" aria-hidden="true"><img src="./assets/brevia-logo-reveal.gif" alt="" /><span class="startup-credit">Powered by zerolovesea</span></div>
    <main class="app-shell" aria-live="polite">
      <aside class="sidebar" aria-label="主导航">
        <button class="brand" data-view="home" aria-label="Brevia 首页"><span class="brand-mark" aria-hidden="true">言</span><img src="./assets/brevia-logo.svg" alt="brevia" /></button>
        <button class="new-meeting" data-view="prepare"><span class="new-meeting-icon">+</span><span class="new-meeting-label">开始会议</span></button>
        <nav>
          <div class="workspace-container"></div>
          <button class="nav-item active" id="all-meetings" data-view="home" aria-expanded="true"><span>⌂</span> 所有会议</button>
          <button class="nav-item" id="recently-deleted" data-view="home"><span>◷</span> 最近删除</button>
          <button class="nav-item" data-view="settings"><span>⚙</span> 设置</button>
        </nav>
        <div class="task-cards" id="task-cards"><aside class="processing-card" id="refinement-progress" hidden aria-live="polite"><header class="task-card-heading"><p>正在精修</p><span class="task-card-actions"><button class="task-card-close" data-minimize-task-card type="button" aria-label="最小化">—</button><button class="task-card-close" data-dismiss-task-card type="button" aria-label="关闭">×</button></span></header><strong id="refinement-percent">准备中</strong><div class="task-card-progress"><div class="processing-bar" aria-hidden="true"><i id="refinement-bar"></i></div><button class="task-card-close" data-pause-task type="button" aria-label="暂停" disabled>Ⅱ</button></div></aside><button class="mini-meeting" id="mini-meeting" hidden><span class="mini-recording"><i></i> 正在录制</span><strong id="mini-title">会议</strong><time id="mini-timer">00:00:00</time><span class="mini-resume">继续会议 →</span></button><section class="mini-playback" id="mini-playback" hidden><span id="mini-playback-state">正在播放</span><strong id="mini-playback-title"></strong><p id="mini-playback-caption"></p><div class="mini-playback-controls"><div class="processing-bar mini-playback-seek" id="mini-playback-seek" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><i id="mini-playback-progress"></i></div><button id="mini-playback-toggle" type="button" aria-label="暂停播放">Ⅱ</button><button class="task-card-close" id="mini-playback-close" type="button" aria-label="关闭播放">×</button></div></section></div>
      </aside>

      <section class="workspace">
        <header class="window-bar"><div class="traffic"><i></i><i></i><i></i></div><span id="crumb">所有会议</span><small class="app-credit">Powered by zerolovesea</small><div class="window-actions"><small id="app-version">v—</small><a class="icon-button" href="https://github.com/zerolovesea/Brevia" target="_blank" rel="noopener" title="GitHub" aria-label="在 GitHub 上查看 Brevia"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.73c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a><div class="language-menu"><button class="icon-button" id="language-toggle" title="切换语言" aria-label="切换语言" aria-expanded="false" aria-controls="language-options">文</button><div class="language-options" id="language-options" role="menu" hidden><button data-language="zh" role="menuitem">中文</button><button data-language="en" role="menuitem">English</button><button data-language="es" role="menuitem">Español</button><button data-language="ja" role="menuitem">日本語</button><button data-language="ko" role="menuitem">한국어</button><button data-language="fr" role="menuitem">Français</button><button data-language="de" role="menuitem">Deutsch</button><button data-language="ru" role="menuitem">Русский</button></div></div><button class="icon-button" id="theme-toggle" title="切换主题" aria-label="切换主题">◐</button></div></header>

        <section class="view active" id="home-view">
          <div class="page-head"><div><button class="eyebrow" id="home-eyebrow" type="button" disabled>会议库</button><h1 id="home-slogan">每一场对话，都留有依据。</h1></div></div>
          <div class="library-toolbar"><label class="search"><span>⌕</span><input id="meeting-search" type="search" placeholder="搜索会议…" /></label><div class="filter" id="date-filter" aria-label="按日期筛选会议"></div><button class="meeting-select-all" id="meeting-select-all" type="button" hidden>全选</button></div>
          <section class="meeting-list" aria-label="最近会议"></section>
        </section>

        <section class="view" id="prepare-view">
          <button class="back" data-view="home">← 返回会议库</button><div class="prepare-layout"><div><p class="eyebrow">准备录制</p><h1>开始一场会议</h1><form id="meeting-form"><label>会议名称<input id="meeting-title" value="会议" maxlength="120" required /></label><div class="form-grid"></div><fieldset><legend>录制音频</legend><label class="choice"><input name="capture-mic" type="checkbox" checked /> <span><b>我的麦克风</b><small id="mic-source-hint">系统默认麦克风</small></span><strong class="input-state" id="mic-input-state"><i class="input-meter" id="mic-level" aria-hidden="true"></i><span id="mic-input-label">输入良好</span></strong></label><label class="choice"><input name="capture-system" type="checkbox" checked /> <span><b>系统音频</b><small id="system-source-hint">需要授予屏幕与系统音频权限</small></span><strong class="input-state" id="system-input-state"><span id="system-input-label">已就绪</span></strong></label></fieldset><div data-meeting-power-saving></div><button class="primary-action wide" type="submit">开始录制 <span>→</span></button></form></div><aside class="model-card"><div class="model-icon">⌁</div><dl><div><dt>计算设备</dt><dd id="active-device">CPU</dd></div><div><dt>会议语言</dt><dd id="active-meeting-language">中文</dd></div><div><dt>会议模式</dt><dd id="active-meeting-mode">标准模式</dd></div></dl><dl class="model-detail-list" hidden><div><dt>实时字幕模型</dt><dd id="active-streaming-model" data-model="zipformer-zh-xlarge-streaming-int8">Streaming Zipformer Chinese XLarge</dd></div><div><dt>说话人分离模型</dt><dd id="active-diarization-model" data-model="pyannote-segmentation-3.0|eres2net-base-3dspeaker-zh">Pyannote + 3D-Speaker</dd></div><div><dt>会后精修模型</dt><dd id="active-refined-model" data-model="funasr-nano-int8">FunASR Nano int8</dd></div></dl><button class="text-button" data-view="settings">管理模型 →</button></aside></div>
        </section>

        <section class="view" id="live-view">
          <header class="live-header"><div class="live-title"><strong id="live-name">会议</strong><div class="live-status"><span class="recording"><i></i> 正在录制</span><time id="timer">00:00:00</time><span class="save-state" id="save-state"><svg class="check-icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8.5 3.2 3.2L13 4.5" /></svg> <span>已保存</span></span></div></div><div class="live-caption-controls"><button class="floating-caption-toggle" id="floating-caption-toggle" data-enabled="false" title="悬浮字幕">字幕</button><button class="translation-toggle" id="translation-toggle" data-enabled="false">译文: 关</button></div><button class="pause-button" id="pause">Ⅱ 暂停</button><button class="end-button" id="end-meeting">结束会议</button></header>
          <div class="live-layout"><section class="live-notes"><header class="live-section-head"><p class="eyebrow">我的笔记</p><button class="ai-assist-toggle" data-ai-assist-toggle type="button" aria-haspopup="true" aria-expanded="false"><span class="ai-assist-toggle-star">✦</span> <span data-ai-assist-toggle-label>AI 辅助</span></button><button class="text-button" data-ai-request type="button" hidden>请求建议</button><button class="live-mode-toggle" data-toggle-live-mode="caption" type="button"><span>展开字幕</span> →</button></header><div class="ai-suggestion" data-ai-suggestion hidden></div><div data-live-notes-root><div class="ai-assist-empty" data-ai-assist-empty hidden></div></div></section><section class="live-captions"><header class="live-section-head"><p class="eyebrow">实时字幕</p><button class="live-mode-toggle" data-toggle-live-mode="notes" type="button"><span>返回笔记</span> ←</button></header><div class="transcript-scroll" id="transcript-scroll"></div><button class="back-to-latest" id="back-to-latest" type="button" hidden><span>↓</span> <span>回到最新</span></button></section></div>
        </section>

        <section class="view" id="detail-view">
          <button class="back" data-view="home">← 返回会议库</button><header class="detail-head"><div class="detail-title"><p class="eyebrow">本地会议</p><h1>会议详情</h1><p class="detail-meta" id="detail-meta"></p></div><div class="detail-actions"><button class="secondary" data-share-detail>分享</button><button class="primary-action" data-export-detail>导出 <span>↓</span></button></div></header><section class="player"><button class="play" id="play" aria-label="播放录音">▶</button><button class="skip">↶ 15</button><button class="skip">15 ↷</button><span class="player-time" id="player-time">00:00</span><input id="progress" type="range" min="0" max="1" value="0" aria-label="播放进度" /><span>本地录音</span><div class="player-speed flow-select"><button class="flow-select-toggle" data-flow-select-toggle type="button" aria-expanded="false">1×<span>⌄</span></button><input id="playback-rate" type="hidden" value="1" /><div class="flow-select-options" hidden><button type="button" data-playback-rate="1">1×</button><button type="button" data-playback-rate="1.25">1.25×</button><button type="button" data-playback-rate="1.5">1.5×</button><button type="button" data-playback-rate="2">2×</button></div></div></section><div class="detail-layout"><section class="final-transcript"></section><aside class="notes"></aside></div>
        </section>

        <section class="view" id="settings-view"><button class="back" data-view="home">← 返回会议库</button><p class="eyebrow">设置</p><h1>模型与本地数据</h1><div class="settings-grid"></div></section>
      </section>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script src="./backend-client.js"></script>
    <script src="./ui-data.js"></script>
    <script src="./i18n.js"></script>
    <script src="./i18n-data.js"></script>
    <script src="./ui-components.js"></script>
    <script src="./workspaces.js"></script>
    <script src="./app-meetings.js"></script>
    <script src="./app-meeting-detail.js"></script>
    <script src="./onboarding.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
