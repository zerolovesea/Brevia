<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Brevia - 言录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <aside class="sidebar" aria-label="主导航">
        <button class="brand" data-view="home" aria-label="Brevia 首页"><img src="./assets/brevia-logo.svg" alt="brevia" /></button>
        <button class="new-meeting" data-view="prepare"><span>+</span> 开始会议</button>
        <nav>
          <button class="nav-item active" id="all-meetings" data-view="home"><span>⌂</span> 所有会议</button>
          <button class="nav-item" id="recently-deleted" data-view="home"><span>◷</span> 最近删除</button>
          <button class="nav-item" data-view="settings"><span>⚙</span> 设置</button>
        </nav>
        <div class="task-cards" id="task-cards"><aside class="processing-card" id="refinement-progress" hidden aria-live="polite"><header class="task-card-heading"><p>正在精修</p><button class="task-card-close" data-dismiss-task-card type="button" aria-label="关闭">×</button></header><strong id="refinement-percent">准备中</strong><div class="processing-bar" aria-hidden="true"><i id="refinement-bar"></i></div></aside></div>
      </aside>

      <section class="workspace">
        <header class="window-bar"><div class="traffic"><i></i><i></i><i></i></div><span id="crumb">所有会议</span><div class="window-actions"><div class="language-menu"><button class="icon-button" id="language-toggle" title="切换语言" aria-label="切换语言" aria-expanded="false" aria-controls="language-options">文</button><div class="language-options" id="language-options" role="menu" hidden><button data-language="zh" role="menuitem">中文</button><button data-language="en" role="menuitem">English</button><button data-language="es" role="menuitem">Español</button><button data-language="ja" role="menuitem">日本語</button><button data-language="ko" role="menuitem">한국어</button><button data-language="fr" role="menuitem">Français</button><button data-language="de" role="menuitem">Deutsch</button><button data-language="ru" role="menuitem">Русский</button></div></div><button class="icon-button" id="theme-toggle" title="切换主题" aria-label="切换主题">◐</button></div></header>

        <section class="view active" id="home-view">
          <div class="page-head"><div><button class="eyebrow" id="home-eyebrow" type="button" disabled>会议库</button><h1 id="home-slogan">每一场对话，都留有依据。</h1></div><button class="primary-action" id="home-primary">开始会议 <span>→</span></button></div>
          <div class="library-toolbar"><label class="search"><span>⌕</span><input id="meeting-search" type="search" placeholder="搜索会议、逐字稿或标签" /></label><div class="filter" id="category-filter" aria-label="按分类筛选会议"></div><div class="filter" id="date-filter" aria-label="按日期筛选会议"></div></div>
          <section class="meeting-list" aria-label="最近会议"></section>
        </section>

        <section class="view" id="prepare-view">
          <button class="back" data-view="home">← 返回会议库</button><div class="prepare-layout"><div><p class="eyebrow">准备录制</p><h1>开始一场会议</h1><form id="meeting-form"><label>会议名称<input id="meeting-title" value="产品策略周会" maxlength="120" required /></label><div class="form-grid"></div><fieldset><legend>录制音频</legend><label class="choice"><input name="capture-mic" type="checkbox" checked /> <span><b>我的麦克风</b><small>系统默认麦克风</small></span><strong class="input-state" id="mic-input-state"><i class="input-meter" id="mic-level" aria-hidden="true"></i>输入良好</strong></label><label class="choice"><input name="capture-system" type="checkbox" checked /> <span><b>系统音频</b><small>需要授予屏幕与系统音频权限</small></span><strong>已就绪</strong></label></fieldset><button class="primary-action wide" type="submit">开始录制 <span>→</span></button></form></div><aside class="model-card"><div class="model-icon">⌁</div><dl><div><dt>计算设备</dt><dd id="active-device">CPU</dd></div><div><dt>实时字幕模型</dt><dd id="active-streaming-model" data-model="zipformer-zh-xlarge-streaming-int8">Streaming Zipformer Chinese XLarge</dd></div><div><dt>说话人分离模型</dt><dd id="active-diarization-model" data-model="pyannote-segmentation-3.0|eres2net-base-3dspeaker-zh">Pyannote + 3D-Speaker</dd></div><div><dt>会后精修模型</dt><dd id="active-refined-model" data-model="qwen3-asr-0.6b-int8">Qwen3-ASR</dd></div></dl><button class="text-button" data-view="settings">管理模型与术语 →</button></aside></div>
        </section>

        <section class="view" id="live-view">
          <header class="live-header"><div class="live-title"><strong id="live-name">产品策略周会</strong><span class="recording"><i></i> 正在录制</span></div><time id="timer">00:00:00</time><button class="pause-button" id="pause">Ⅱ 暂停</button><button class="end-button" id="end-meeting">结束会议</button></header>
          <div class="live-layout"><section class="transcript" aria-label="实时字幕"><div class="section-heading"><div class="current-caption"><p class="eyebrow">实时字幕</p><h1 id="live-caption" aria-live="polite"></h1><p class="live-caption-translation" id="live-caption-translation" hidden></p></div><button class="translation-toggle" id="translation-toggle" data-enabled="false">译文: 关</button></div><div class="transcript-scroll" id="transcript-scroll"></div><section class="tts-chat" id="tts-chat"></section></section><aside class="live-panel"></aside></div>
        </section>

        <section class="view" id="detail-view">
          <button class="back" data-view="home">← 返回会议库</button><header class="detail-head"><div><p class="eyebrow">本地会议</p><h1>会议详情</h1><p>原始录音与每版逐字稿均保存在本机</p></div><div class="detail-actions"><div class="detail-refine flow-select"><button class="secondary" data-flow-select-toggle type="button" aria-expanded="false">精修 <span>⌄</span></button><input type="hidden" value="qwen3-asr-0.6b-int8" /><div class="flow-select-options" hidden><button type="button" data-refine-model="qwen3-asr-0.6b-int8">Qwen3-ASR</button><button type="button" data-refine-model="qwen3-asr-1.7b-int8">Qwen3-ASR 1.7B int8</button><button type="button" data-refine-model="whisper-turbo">Whisper Turbo</button></div></div><button class="secondary" data-separate-detail>声源分离</button><button class="secondary" data-share-detail>转发</button><button class="primary-action" data-export-detail>导出 <span>↓</span></button></div></header><section class="player"><button class="play" id="play" aria-label="播放录音">▶</button><button class="skip">↶ 15</button><button class="skip">15 ↷</button><span class="player-time" id="player-time">00:00</span><input id="progress" type="range" min="0" max="1" value="0" aria-label="播放进度" /><span>本地录音</span><div class="player-speed flow-select"><button class="flow-select-toggle" data-flow-select-toggle type="button" aria-expanded="false">1×<span>⌄</span></button><input id="playback-rate" type="hidden" value="1" /><div class="flow-select-options" hidden><button type="button" data-playback-rate="1">1×</button><button type="button" data-playback-rate="1.25">1.25×</button><button type="button" data-playback-rate="1.5">1.5×</button><button type="button" data-playback-rate="2">2×</button></div></div></section><div class="detail-layout"><section class="final-transcript"></section><aside class="notes"></aside></div>
        </section>

        <section class="view" id="settings-view"><button class="back" data-view="home">← 返回会议库</button><p class="eyebrow">设置</p><h1>模型与本地数据</h1><div class="settings-grid"></div></section>
      </section>
    </main>
    <button class="mini-meeting" id="mini-meeting" hidden><span class="mini-recording"><i></i> 正在录制</span><strong id="mini-title">产品策略周会</strong><time id="mini-timer">00:00:00</time><span class="mini-resume">继续会议 →</span></button>
    <div class="toast" id="toast" role="status"></div>
    <script src="./backend-client.js"></script>
    <script src="./ui-data.js"></script>
    <script src="./i18n.js"></script>
    <script src="./i18n-data.js"></script>
    <script src="./ui-components.js"></script>
    <script src="./app-meetings.js"></script>
    <script src="./app-meeting-detail.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
