<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Floating Caption</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: transparent;
        color: white;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .caption-container {
        padding: 16px 20px;
        min-height: 100px;
        position: relative;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 8px;
        transition: background 0.2s ease;
        cursor: move;
      }

      .caption-container:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      .caption-controls {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .caption-container:hover .caption-controls {
        opacity: 1;
      }

      .close-btn {
        position: relative;
        width: 20px;
        height: 20px;
        border: none;
        background: transparent;
        color: #666;
        cursor: pointer;
        font-size: 0;
        line-height: 1;
        display: grid;
        place-items: center;
        transition: opacity 0.2s ease;
        padding: 0;
      }

      .close-btn:hover {
        opacity: 0.6;
      }

      .close-btn::before,
      .close-btn::after {
        content: '';
        position: absolute;
        width: 12px;
        height: 1px;
        background: currentColor;
      }

      .close-btn::before {
        transform: rotate(45deg);
      }

      .close-btn::after {
        transform: rotate(-45deg);
      }

      .caption-text {
        font-size: clamp(20px, 2vw, 32px);
        line-height: 1.5;
        font-weight: normal;
        color: white;
        letter-spacing: -0.035em;
        word-wrap: break-word;
        overflow-wrap: break-word;
        max-height: calc(1.5em * 3);
        overflow-y: auto;
        overflow-x: hidden;
        transition: opacity 0.2s ease;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .caption-text::-webkit-scrollbar {
        display: none;
      }

      .caption-finalized {
        font-size: clamp(16px, 1.6vw, 24px);
        line-height: 1.4;
        font-weight: normal;
        color: rgba(255, 255, 255, 0.75);
        word-wrap: break-word;
        overflow-wrap: break-word;
        letter-spacing: -0.035em;
        max-height: calc(1.4em * 3);
        overflow-y: auto;
        overflow-x: hidden;
        margin-bottom: 6px;
        transition: opacity 0.2s ease;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .caption-finalized::-webkit-scrollbar {
        display: none;
      }

      .caption-finalized.hidden {
        display: none;
      }

      .caption-translation {
        font-size: 16px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 8px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        transition: opacity 0.2s ease;
      }

      .caption-translation.hidden {
        display: none;
      }

      .caption-translation.dimmed {
        opacity: 0.5;
      }

      /* Light theme adjustments */
      @media (prefers-color-scheme: light) {
        .caption-container {
          background: rgba(255, 255, 255, 0.3);
        }

        .caption-container:hover {
          background: rgba(255, 255, 255, 0.95);
        }

        .caption-text {
          color: #1d1d1f;
        }

        .caption-finalized {
          color: rgba(0, 0, 0, 0.65);
        }

        .caption-translation {
          color: rgba(0, 0, 0, 0.7);
        }

        .close-btn {
          color: #666;
        }
      }
    </style>
  </head>
  <body>
    <div class="caption-container" id="caption-container">
      <div class="caption-controls">
        <button class="close-btn" id="close-btn" title="Close" aria-label="关闭">×</button>
      </div>
      <div class="caption-finalized hidden" id="caption-finalized"></div>
      <div class="caption-text" id="caption-text"></div>
      <div class="caption-translation hidden" id="caption-translation"></div>
    </div>

    <script src="./floating-caption.js"></script>
  </body>
</html>
