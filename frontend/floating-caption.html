<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Floating Caption</title>
    <link rel="stylesheet" href="./motion.css" />
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: light dark; }
      body { margin: 0; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: transparent; color: light-dark(#202124, #f5f5f5); }
      .caption-shell {
        --caption-size: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 8px 16px 12px;
        border: 1px solid light-dark(#dedfe1, #45464a);
        border-radius: 16px;
        background: light-dark(#fcfcfd, #232427);
      }
      .caption-header, .caption-controls { display: flex; align-items: center; gap: 4px; }
      .caption-header { justify-content: space-between; cursor: grab; user-select: none; }
      .caption-header strong { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
      .caption-header strong::before { content: ""; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
      .caption-controls { color: light-dark(#65666b, #bdbec2); }
      .caption-controls button {
        display: grid; place-items: center; width: 28px; height: 26px; padding: 0;
        border: none; border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer;
      }
      .caption-controls button:is(:hover, [aria-pressed="true"]) { background: light-dark(#eaeaec, #383a3e); color: light-dark(#181819,#fff); }
      .caption-controls svg { width: 15px; height: 15px; }
      .caption-size-value { font-size: 11px; font-variant-numeric: tabular-nums; }
      .caption-controls .close-btn { margin-inline-start: 4px; font-size: 18px; }
      .caption-container { min-height: 0; flex: 1; overflow-y: auto; scrollbar-width: thin; overflow-wrap: anywhere; padding: 8px 2px 0; cursor: grab; }
      .caption-container:active, .caption-header:active { cursor: grabbing; }
      .caption-finalized, .caption-text { font-size: var(--caption-size); line-height: 1.45; }
      .caption-finalized:not(.hidden) + .caption-text:not(:empty) { margin-top: 5px; }
      .caption-translation, .caption-container::before { color: light-dark(#62646a, #b7bac1); }
      .caption-translation { font-size: calc(var(--caption-size) * .86); line-height: 1.4; padding-inline-start: 8px; border-inline-start: 2px solid light-dark(#c6c9cf,#626771); margin-block: 4px; }
      .caption-container:has(.caption-finalized.hidden):has(.caption-text:empty)::before { content: attr(data-waiting); font-size: var(--caption-size); }
      .hidden { display: none; }
      .dimmed { opacity: .6; }
      .translation-loading { display: inline-flex; gap: 3px; align-items: center; height: 1em; }
      .translation-loading span { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: translation-dot 1.2s ease-in-out infinite alternate; }
      .translation-loading span:nth-child(2) { animation-delay: -.35s; }
      .translation-loading span:nth-child(3) { animation-delay: -.7s; }
      @keyframes translation-dot { from { opacity: .3; } to { opacity: 1; } }
      .caption-fade { animation: caption-fade 160ms ease-out; }
      @keyframes caption-fade { from { opacity: 0.65; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .caption-fade, .translation-loading span { animation: none; } }
    </style>
  </head>
  <body>
    <div class="caption-shell">
      <header class="caption-header"
        ><strong data-caption-title>实时字幕</strong
        ><div class="caption-controls"
          ><button id="caption-pin" type="button" aria-pressed="true" aria-label="置顶"
            ><svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m16 3 5 5-3 1-4 4 1 4-3 3-4-4-4-4 3-3 4 1 4-4 1-3Z" />
              <path d="m8 16-5 5" /></svg></button
          ><button id="caption-smaller" type="button" aria-label="减小字号">A−</button
          ><span class="caption-size-value">20</span
          ><button id="caption-larger" type="button" aria-label="增大字号">A+</button>
          <button class="close-btn" id="close-btn" title="" aria-label="">×</button>
        </div></header
      >
      <div class="caption-container" data-waiting="等待语音" id="caption-container">
        <div class="caption-finalized hidden" id="caption-finalized"></div>
        <div class="caption-text" id="caption-text"></div>
        <div class="caption-translation hidden" id="caption-translation"></div>
      </div>
    </div>

    <script src="./i18n-data.js"></script>
    <script src="./motion.js"></script>
    <script src="./floating-caption.js"></script>
  </body>
</html>
