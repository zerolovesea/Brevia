<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>声纹识别演示</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #fff;
      }

      .demo-wrapper {
        width: 100%;
        height: 100%;
        background: #fff;
        overflow: hidden;
        position: relative;
      }

      .app-shell {
        width: 1440px;
        height: 900px;
        transform-origin: top left;
        position: absolute;
        top: 0;
        left: 0;
      }

      #live-view.active {
        display: grid;
      }

      .live-layout {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div class="demo-wrapper">
      <main class="app-shell" aria-live="polite">
        <aside class="sidebar" aria-label="主导航">
          <button class="brand" aria-label="言录首页">
            <img src="./assets/brevia-logo.svg" alt="brevia" />
          </button>
          <button class="new-meeting"><span>+</span> 开始会议</button>
          <nav>
            <button class="nav-item"><span>⌂</span> 所有会议</button>
            <button class="nav-item"><span>◷</span> 最近删除</button>
            <button class="nav-item"><span>⚙</span> 设置</button>
          </nav>
        </aside>

        <section class="workspace">
          <header class="window-bar">
            <div class="traffic"><i></i><i></i><i></i></div>
            <span id="crumb">实时会议</span>
            <div class="window-actions">
              <button class="icon-button" aria-label="切换主题">◐</button>
            </div>
          </header>

          <section class="view active" id="live-view">
            <header class="live-header">
              <div class="live-title">
                <strong>团队周会</strong>
                <span class="recording"><i></i> 正在录制</span>
              </div>
              <time id="timer">00:15:23</time>
              <button class="pause-button">Ⅱ 暂停</button>
              <button class="end-button">结束会议</button>
            </header>

            <div class="live-layout">
              <section class="transcript" aria-label="实时字幕">
                <div class="section-heading">
                  <div class="current-caption">
                    <p class="eyebrow">实时字幕</p>
                    <h1 id="live-caption" aria-live="polite">我这边的进度已经完成了百分之八十。</h1>
                  </div>
                </div>

                <div class="transcript-scroll" id="transcript-scroll">
                  <article class="segment">
                    <div class="segment-meta">
                      <time>00:14:12</time>
                      <b>张伟</b>
                    </div>
                    <div class="segment-copy">
                      <p>大家好，我们开始今天的周会吧。</p>
                    </div>
                  </article>

                  <article class="segment">
                    <div class="segment-meta">
                      <time>00:14:28</time>
                      <b>李娜</b>
                    </div>
                    <div class="segment-copy">
                      <p>好的，我先汇报一下我这边的工作进展。</p>
                    </div>
                  </article>

                  <article class="segment">
                    <div class="segment-meta">
                      <time>00:14:45</time>
                      <b>王强</b>
                    </div>
                    <div class="segment-copy">
                      <p>上周遇到的技术问题已经解决了。</p>
                    </div>
                  </article>

                  <article class="segment is-active">
                    <div class="segment-meta">
                      <time>00:15:18</time>
                      <b>李娜</b>
                    </div>
                    <div class="segment-copy">
                      <p>我这边的进度已经完成了百分之八十。</p>
                    </div>
                  </article>
                </div>
              </section>

              <aside class="live-panel">
                <section>
                  <p class="eyebrow">参与者（已识别声纹）</p>
                  <div class="participants-list">
                    <article class="person">
                      <div class="avatar blue">张</div>
                      <span>
                        <b>张伟</b>
                        <small>项目经理</small>
                      </span>
                    </article>
                    <article class="person">
                      <div class="avatar gray">李</div>
                      <span>
                        <b>李娜</b>
                        <small>前端工程师</small>
                      </span>
                    </article>
                    <article class="person">
                      <div class="avatar blue">王</div>
                      <span>
                        <b>王强</b>
                        <small>后端工程师</small>
                      </span>
                    </article>
                  </div>
                </section>

                <section>
                  <p class="eyebrow">声纹识别</p>
                  <div class="live-settings">
                    <p style="font-size: 13px; color: #666; line-height: 1.6;">
                      系统已自动识别 3 位参与者的声纹特征，无需手动标注说话人。
                    </p>
                  </div>
                </section>
              </aside>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script>
      function scaleDemo() {
        const wrapper = document.querySelector('.demo-wrapper');
        const shell = document.querySelector('.app-shell');

        if (!wrapper || !shell) return;

        const wrapperRect = wrapper.getBoundingClientRect();
        const scaleX = wrapperRect.width / 1440;
        const scaleY = wrapperRect.height / 900;
        const scale = Math.min(scaleX, scaleY, 1);

        shell.style.transform = `scale(${scale})`;

        // Center the scaled content
        const scaledWidth = 1440 * scale;
        const scaledHeight = 900 * scale;
        shell.style.left = `${(wrapperRect.width - scaledWidth) / 2}px`;
        shell.style.top = `${(wrapperRect.height - scaledHeight) / 2}px`;
      }

      window.addEventListener('load', scaleDemo);
      window.addEventListener('resize', scaleDemo);

      // Initial call
      scaleDemo();
    </script>
  </body>
</html>
