name: Native macOS validation

on:
  pull_request:
    paths: &native-macos-paths
      - 'macos/**'
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'skills/brevia/**'
      - 'package*.json'
      - '.github/workflows/native-macos.yml'
      - '.github/workflows/release.yml'
      - '!macos/**/*.md'
      - '!macos/host/src/windows.rs'
      - '!desktop/**/*.md'
      - '!frontend/**/*.md'
      - '!backend/**/*.md'
      - '!scripts/**/*.md'
      - '!scripts/ci-mobile-changes.py'
      - '!scripts/test-ci-mobile-changes.py'
  push:
    branches: [main]
    paths: *native-macos-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Prepare native toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app
          xcodebuild -version
          xcrun swift --version
          xcodebuild -downloadComponent MetalToolchain
      - name: Identify native cache image
        id: native-cache-image
        shell: bash
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      # 只缓存编译依赖；安装包、签名材料及宿主最终可执行文件不进入缓存。
      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: |
            dist/native/inference-sources
            macos/inference/.build
            macos/host/target/release/deps/*
            macos/host/target/release/build
            macos/host/target/release/.fingerprint
            ~/.cargo/registry
            !macos/host/target/release/deps/brevia_host-*
          key: native-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-image.outputs.version }}-${{ hashFiles('.github/workflows/native-macos.yml', '.github/workflows/windows-backend.yml', '.github/workflows/release.yml', 'macos/host/Cargo.lock', 'macos/inference/Package.swift', 'macos/inference/Package.resolved', 'macos/inference/build.sh', 'macos/inference/*.patch', 'windows/build.cjs', 'windows/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            native-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-image.outputs.version }}-${{ hashFiles('.github/workflows/native-macos.yml', '.github/workflows/windows-backend.yml', '.github/workflows/release.yml', 'macos/host/Cargo.lock', 'macos/inference/Package.swift', 'macos/inference/Package.resolved', 'macos/inference/build.sh', 'macos/inference/*.patch', 'windows/build.cjs', 'windows/CMakeLists.txt') }}-
      - name: Restore native bundler
        id: tauri-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - name: Install native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Verify native bundler
        shell: bash
        run: |
          version=$(cargo tauri --version)
          printf '%s\n' "$version"
          test "${version##* }" = '2.12.2'
      - name: Cache native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run dist:mac
      - run: npm run test:mac:webkit
