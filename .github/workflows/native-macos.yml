name: Native macOS validation

on:
  pull_request:
    paths:
      - 'macos/**'
      - 'electron/**'
      - 'frontend/**'
      - 'backend/*.json'
      - 'scripts/**'
      - 'skills/brevia/**'
      - 'package*.json'
      - '.github/workflows/native-macos.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'electron/**'
      - 'frontend/**'
      - 'backend/*.json'
      - 'scripts/**'
      - 'skills/brevia/**'
      - 'package*.json'
      - '.github/workflows/native-macos.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      # 仅供死代码分析器，不构建或安装 Python 后端。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Prepare native toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app
          xcodebuild -downloadComponent MetalToolchain
      - run: npm test
        env:
          BREVIA_SKIP_E2E: '1'
      - run: npm run dist:mac
      - run: npm run test:mac:webkit
