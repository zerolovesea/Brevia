name: Deploy website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mobile/lib/**'
      - 'mobile/web/**'
      - 'mobile/assets/**'
      - 'mobile/pubspec.*'
      - 'frontend/**'
      - 'docs/assets/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - name: Build mobile product demo
        working-directory: mobile
        run: flutter build web --target=web/preview.dart --output=../website/mobile-preview --no-web-resources-cdn --no-tree-shake-icons
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p site/docs
          rsync -a --exclude='.DS_Store' website/ site/
          rsync -a frontend/ site/frontend/
          rsync -a docs/assets/ site/docs/assets/
          sed -i 's#\.\./frontend/#./frontend/#g; s#\.\./docs/assets/#./docs/assets/#g' site/*.html
          printf 'brevia.work\n' > site/CNAME
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
