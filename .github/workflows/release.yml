name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            artifact: |
              dist/Brevia-*.dmg
              dist/Brevia-*.zip
              dist/Brevia-*.zip.blockmap
              dist/latest-mac.yml
          - name: Windows x64
            os: windows-latest
            artifact: |
              dist/Brevia-*-x64-setup.exe
              dist/Brevia-*-x64-setup.exe.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r backend/requirements-build.txt
      - run: npm test
      - name: Bundle Python runtime and dependencies
        run: python backend/pack_worker.py
      - name: Bundle llama sidecar
        run: python backend/pack_llama_sidecar.py
      - name: Configure Apple signing and notarization
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
      - name: Package and notarize macOS
        if: matrix.os == 'macos-14'
        run: npm run package:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: npm run package:win
        env:
          # 有 Windows 代码签名证书时，用这两个 secret 签名（避免杀软/SmartScreen 拦截安装器）。
          # 未配置时保持未签名构建，不会导致流程失败。
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
      - name: Verify macOS signature and notarization
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          APP="dist/mac-arm64/Brevia.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write mirror release index
        run: >
          node -e "const fs = require('node:fs'); fs.writeFileSync('dist/release.json', JSON.stringify({ tag: process.env.GITHUB_REF_NAME, assets: fs.readdirSync('dist').filter((name) => /\\.(dmg|exe)$/.test(name)) }))"
      - name: Mirror release to ModelScope
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_REPO: zyaztec/brevia-release
        run: |
          python -m pip install --disable-pip-version-check modelscope
          modelscope --token "$MODELSCOPE_API_TOKEN" upload "$MODELSCOPE_REPO" dist --repo-type model --commit-message "Mirror $GITHUB_REF_NAME" --disable-tqdm
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Brevia $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
      - name: Commit website download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          node scripts/update-release-links.mjs
          git add website/index-zh.html website/index-en.html
          git diff --cached --quiet || git commit -m "chore: update download links for $GITHUB_REF_NAME"
          git push origin main
