name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-26
            artifact: |
              dist/native/Brevia-WebKit-*-arm64.dmg
              dist/native/Brevia-WebKit-*-arm64.app.tar.gz
              dist/native/Brevia-WebKit-*-arm64.app.tar.gz.sig
              dist/native/latest-webkit.json
          - name: Windows x64
            os: windows-latest
            artifact: |
              dist/Brevia-*-x64-setup.exe
              dist/Brevia-*-x64-setup.exe.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Prepare native macOS toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app
          xcodebuild -downloadComponent MetalToolchain
          cargo install tauri-cli --version 2.12.2 --locked
      - name: Build Windows llama runtime with AVX2
        if: matrix.os == 'windows-latest'
        env:
          # 固定 CPU 指令集，避免把构建机的 AVX512 带入用户机器；强制源码构建并跳过 wheel 缓存。
          CMAKE_ARGS: >-
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON
            -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF
            -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF
        run: python -m pip install --no-binary=llama-cpp-python --no-cache-dir -r backend/requirements-build.txt
      - run: npm test
        env:
          # macOS 由成品 WKWebView 冒烟验证；Windows runner 无法可靠启动 Electron。
          BREVIA_SKIP_E2E: '1'
      - name: Bundle Python runtime and dependencies
        if: runner.os == 'Windows'
        run: python backend/pack_worker.py
      - name: Bundle llama sidecar
        if: runner.os == 'Windows'
        run: python backend/pack_llama_sidecar.py
      - name: Verify frozen Windows runtime
        if: matrix.os == 'windows-latest'
        run: python backend/diagnose_windows_bundle.py --runtime backend/runtime
      - name: Configure Apple signing and native updates
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD BREVIA_NATIVE_UPDATE_PUBKEY TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Secret: $name (see DEVELOPMENT.md)"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/brevia.p12"
          keychain="$RUNNER_TEMP/brevia.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/brevia.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
          test -n "$identity"
          printf 'BREVIA_SIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
      - name: Package and notarize native macOS
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check packaged native macOS application
        if: runner.os == 'macOS'
        run: npm run test:mac:webkit
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: npm run package:win
        env:
          # 有 Windows 代码签名证书时，用这两个 secret 签名（避免杀软/SmartScreen 拦截安装器）。
          # 未配置时保持未签名构建，不会导致流程失败。
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
      - name: Verify packaged Windows CLI and MCP
        if: runner.os == 'Windows'
        run: node scripts/test-packaged-agent.cjs dist/win-unpacked
      - name: Verify packaged Windows runtime
        if: matrix.os == 'windows-latest'
        run: python backend/diagnose_windows_bundle.py --runtime dist/win-unpacked/resources/backend/runtime --packaged
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/native/image/Brevia.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate dist/native/Brevia-WebKit-*-arm64.dmg
          test -s dist/native/latest-webkit.json
          test -s dist/native/Brevia-WebKit-*-arm64.app.tar.gz.sig
      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/brevia.keychain-db" || true
          rm -f "$RUNNER_TEMP/brevia.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write mirror release index
        run: >
          node -e "const fs = require('node:fs'); fs.writeFileSync('dist/release.json', JSON.stringify({ tag: process.env.GITHUB_REF_NAME, assets: fs.readdirSync('dist').filter((name) => /\\.(dmg|exe)$/.test(name)) }))"
      - name: Mirror release to ModelScope
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_REPO: zyaztec/brevia-release
        run: |
          python -m pip install --disable-pip-version-check modelscope
          modelscope --token "$MODELSCOPE_API_TOKEN" upload "$MODELSCOPE_REPO" dist --repo-type model --commit-message "Mirror $GITHUB_REF_NAME" --disable-tqdm
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Brevia $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
      - name: Commit download links
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/update-release-links.mjs
          git add website/index-zh.html website/index-en.html README.md docs/README.*.md
          git diff --cached --quiet || git commit -m "chore: update download links for $GITHUB_REF_NAME"
          git push origin main
          gh workflow run deploy-pages.yml --ref main
