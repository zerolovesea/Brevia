name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-26
            cache-paths: |
              dist/native/inference-sources
              macos/inference/.build
              macos/host/target/release/deps/*
              macos/host/target/release/build
              macos/host/target/release/.fingerprint
              ~/.cargo/registry
              !macos/host/target/release/deps/brevia_host-*
            artifact: |
              dist/native/Brevia-WebKit-*-arm64.dmg
              dist/native/Brevia-WebKit-*-arm64.app.tar.gz
              dist/native/Brevia-WebKit-*-arm64.app.tar.gz.sig
              dist/native/Brevia-*-arm64-mac.zip
              dist/native/latest-mac.yml
              dist/native/latest-webkit.json
          - name: Windows x64
            os: windows-latest
            cache-paths: |
              dist/native-win/sources
              dist/native-win/build
              macos/host/target/release/deps/*
              macos/host/target/release/build
              macos/host/target/release/.fingerprint
              ~/.cargo/registry
              !macos/host/target/release/deps/brevia_host-*
            artifact: |
              dist/native-win/Brevia-*-x64-setup.exe
              dist/native-win/Brevia-*-x64-setup.exe.sig
              dist/native-win/latest.yml
              dist/native-win/latest-windows.json
              dist/native-win/latest-windows-cuda.json
              dist/native-win/Brevia-*-x64-cuda-setup.exe*
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - name: Prepare native macOS toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app
          xcodebuild -version
          xcrun swift --version
          xcodebuild -downloadComponent MetalToolchain
      - name: Identify native cache image
        id: native-cache-image
        shell: bash
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      # 只缓存编译依赖；安装包、签名材料及宿主最终可执行文件不进入缓存。
      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-paths }}
          key: native-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-image.outputs.version }}-${{ hashFiles('.github/workflows/native-macos.yml', '.github/workflows/windows-backend.yml', '.github/workflows/release.yml', 'macos/host/Cargo.lock', 'macos/inference/Package.swift', 'macos/inference/Package.resolved', 'macos/inference/build.sh', 'macos/inference/*.patch', 'windows/build.cjs', 'windows/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            native-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-image.outputs.version }}-${{ hashFiles('.github/workflows/native-macos.yml', '.github/workflows/windows-backend.yml', '.github/workflows/release.yml', 'macos/host/Cargo.lock', 'macos/inference/Package.swift', 'macos/inference/Package.resolved', 'macos/inference/build.sh', 'macos/inference/*.patch', 'windows/build.cjs', 'windows/CMakeLists.txt') }}-
      - uses: ./.github/actions/bundled-vad
      - name: Restore native bundler
        id: tauri-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - name: Install native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Verify native bundler
        shell: bash
        run: |
          version=$(cargo tauri --version)
          printf '%s\n' "$version"
          test "${version##* }" = '2.12.2'
      - name: Cache native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - name: Configure Apple signing and native updates
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD BREVIA_NATIVE_UPDATE_PUBKEY TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Secret: $name (see DEVELOPMENT.md)"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/brevia.p12"
          keychain="$RUNNER_TEMP/brevia.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/brevia.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
          test -n "$identity"
          printf 'BREVIA_SIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
      - name: Package and notarize native macOS
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check packaged native macOS application
        if: runner.os == 'macOS'
        run: npm run test:mac:webkit
      - name: Configure Windows signing when a certificate is available
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CERTIFICATE_P12_BASE64: ${{ secrets.WIN_CERTIFICATE_P12_BASE64 }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WIN_CERTIFICATE_P12_BASE64) {
            $file = Join-Path $env:RUNNER_TEMP 'brevia.pfx'
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:WIN_CERTIFICATE_P12_BASE64))
            $password = ConvertTo-SecureString $env:WIN_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password $password
            "BREVIA_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
            Remove-Item $file
          }
      - name: Package native Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify native Windows WebView and update artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node macos/host/smoke.cjs dist/native-win/app
          if (!(Test-Path dist/native-win/latest-windows.json)) { throw 'Native update signature missing' }
      - name: Verify Windows upgrade preserves data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node windows/test-upgrade.cjs "dist/native-win/Brevia-$version-x64-setup.exe"
      - name: Restore verified Windows smoke models
        if: runner.os == 'Windows'
        id: smoke-models-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/native-smoke-models
          key: native-models-v1-${{ hashFiles('backend/models.json') }}
      - name: Prepare verified Windows smoke models
        if: runner.os == 'Windows'
        run: node scripts/prepare-native-smoke.cjs dist/native-smoke-models
      - name: Cache verified Windows smoke models
        if: runner.os == 'Windows' && steps.smoke-models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/native-smoke-models
          key: native-models-v1-${{ hashFiles('backend/models.json') }}
      - name: Verify real Windows inference before release
        if: runner.os == 'Windows'
        run: node macos/inference/smoke.cjs dist/native-smoke-models dist/native-win/app/resources/engines
      - name: Package and verify signed Windows CUDA installer
        shell: pwsh
        if: runner.os == 'Windows'
        env:
          BREVIA_BUILD_BACKEND: cuda
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/native-win/latest-windows-cuda.json)) { throw 'CUDA update signature missing' }
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/native/image/Brevia.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate dist/native/Brevia-WebKit-*-arm64.dmg
          test -s dist/native/latest-webkit.json
          test -s dist/native/Brevia-WebKit-*-arm64.app.tar.gz.sig
      - name: Prepare the v1.4.5 macOS in-app upgrade
        if: runner.os == 'macOS'
        run: node scripts/legacy-update.mjs dist/native/image/Brevia.app dist/native
      - name: Prepare the v1.4.5 Windows in-app upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/legacy-update.mjs "dist/native-win/Brevia-$version-x64-setup.exe"
      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/brevia.keychain-db" || true
          rm -f "$RUNNER_TEMP/brevia.p12"
      - name: Remove Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:BREVIA_WINDOWS_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:BREVIA_WINDOWS_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'brevia.pfx') -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  linux:
    uses: ./.github/workflows/native-linux-mlx.yml
    with:
      signed: true
    secrets:
      BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write mirror release index
        run: >
          node -e "const fs = require('node:fs'); fs.writeFileSync('dist/release.json', JSON.stringify({ tag: process.env.GITHUB_REF_NAME, assets: fs.readdirSync('dist').filter((name) => /\\.(dmg|exe|deb)$/.test(name)) }))"
      - name: Mirror release to ModelScope
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_REPO: zyaztec/brevia-release
        run: |
          python -m pip install --disable-pip-version-check modelscope
          modelscope --token "$MODELSCOPE_API_TOKEN" upload "$MODELSCOPE_REPO" dist --repo-type model --commit-message "Mirror $GITHUB_REF_NAME" --disable-tqdm
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Brevia $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
      - name: Commit download links
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/update-release-links.mjs
          git add website/index-zh.html website/index-en.html README.md docs/README.*.md
          git diff --cached --quiet || git commit -m "chore: update download links for $GITHUB_REF_NAME"
          git push origin main
          gh workflow run deploy-pages.yml --ref main
