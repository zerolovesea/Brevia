name: Native Linux validation
on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
    secrets:
      BREVIA_NATIVE_UPDATE_PUBKEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
  pull_request:
    paths: &linux-paths
      - 'inference/mlx/**'
      - 'linux/**'
      - 'backend/**'
      - 'cloudflare/share/schema.cjs'
      - 'desktop/**'
      - 'frontend/**'
      - 'macos/backend/**'
      - 'macos/control.cjs'
      - 'macos/native-audio.cjs'
      - 'macos/bridge.js'
      - 'macos/host/**'
      - 'macos/inference/*.cpp'
      - 'macos/inference/*.h'
      - 'macos/inference/opus-stereo.patch'
      - 'scripts/**'
      - 'windows/AudioCapture.cpp'
      - 'windows/CMakeLists.txt'
      - 'windows/build.cjs'
      - 'skills/brevia/**'
      - 'package*.json'
      - '.github/workflows/native-linux-mlx.yml'
  push:
    branches: [main]
    paths: *linux-paths
permissions:
  contents: read
jobs:
  debian:
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - env:
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libssl-dev libblas-dev liblapack-dev libopenblas0-pthread libarchive-tools patchelf pulseaudio xvfb jq
          npm ci
          npm run dist:linux -- ${{ matrix.backend }}
      - run: |
          sudo apt-get install -y ./dist/native-linux/*.deb
          dbus-run-session -- xvfb-run -a linux/smoke.sh ${{ matrix.backend }}
      - name: Sign verified Debian update
        if: inputs.signed
        env:
          BREVIA_NATIVE_UPDATE_PUBKEY: ${{ secrets.BREVIA_NATIVE_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          cargo install tauri-cli --version 2.12.2 --locked
          deb=(dist/native-linux/*-amd64-${{ matrix.backend }}.deb)
          cargo tauri signer sign --app-version "$(node -p 'require("./package.json").version')" "${deb[0]}"
          node -e "require('./scripts/native-update-feed.cjs').writeNativeFeed(process.argv[1],process.argv[2],'linux-x86_64')" "${deb[0]}" dist/native-linux/latest-linux-${{ matrix.backend }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: Brevia-linux-x64-${{ matrix.backend }}
          path: |
            dist/native-linux/*-amd64-${{ matrix.backend }}.deb
            dist/native-linux/*.deb.sig
            dist/native-linux/latest-linux-*.json
          if-no-files-found: error
