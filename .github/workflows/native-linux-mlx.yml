name: Native Linux validation
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: &linux-paths
      - 'inference/mlx/**'
      - 'linux/**'
      - 'backend/**'
      - 'cloudflare/share/schema.cjs'
      - 'desktop/**'
      - 'frontend/**'
      - 'macos/backend/**'
      - 'macos/control.cjs'
      - 'macos/native-audio.cjs'
      - 'macos/bridge.js'
      - 'macos/host/**'
      - 'macos/inference/*.cpp'
      - 'macos/inference/*.h'
      - 'macos/inference/opus-stereo.patch'
      - 'scripts/**'
      - 'windows/AudioCapture.cpp'
      - 'windows/CMakeLists.txt'
      - 'windows/build.cjs'
      - 'skills/brevia/**'
      - 'package*.json'
      - '.github/workflows/native-linux-mlx.yml'
  push:
    branches: [main]
    paths: *linux-paths
permissions:
  contents: read
jobs:
  debian:
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libssl-dev libblas-dev liblapack-dev libopenblas0-pthread libarchive-tools patchelf pulseaudio xvfb jq
          npm ci
          npm run dist:linux -- ${{ matrix.backend }}
      - run: |
          sudo apt-get install -y ./dist/native-linux/*.deb
          dbus-run-session -- xvfb-run -a linux/smoke.sh ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        with:
          name: Brevia-linux-x64-${{ matrix.backend }}
          path: dist/native-linux/*-amd64-${{ matrix.backend }}.deb
          if-no-files-found: error
