name: Native Windows validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows/**'
      - 'macos/**'
      - 'backend/**'
      - 'electron/**'
      - 'frontend/**'
      - 'skills/brevia/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/windows-backend.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BREVIA_SKIP_E2E: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      # 仅运行旧源码的静态分析，不安装或打包 Python 推理环境。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: |
            dist/native-win/sources
            macos/host/target
            ~/.cargo/registry
          key: native-windows-${{ hashFiles('macos/host/Cargo.lock', 'windows/build.cjs', 'windows/CMakeLists.txt') }}
      - name: Install native bundler
        run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Build complete native Windows installer
        run: npm run dist:win
      - name: Test native host
        run: cargo test --release --locked --manifest-path macos/host/Cargo.toml
      - name: Test real WebView2 and PDF export
        run: node macos/host/smoke.cjs dist/native-win/app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.sha }}
          path: |
            dist/native-win/app/
            dist/native-win/Brevia-*-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
