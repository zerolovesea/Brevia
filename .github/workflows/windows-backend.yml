name: Native Windows validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows/**'
      - 'macos/**'
      - 'backend/**'
      - 'electron/**'
      - 'frontend/**'
      - 'skills/brevia/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/windows-backend.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      # 仅运行旧源码的静态分析，不安装或打包 Python 推理环境。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
        env:
          BREVIA_SKIP_E2E: '1'
  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            dist/native-win/sources
            macos/host/target
            ~/.cargo/registry
          key: native-windows-${{ hashFiles('macos/host/Cargo.lock', 'windows/build.cjs', 'windows/CMakeLists.txt') }}
      - name: Restore native bundler
        id: tauri-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - name: Install native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Verify native bundler
        shell: bash
        run: |
          version=$(cargo tauri --version)
          printf '%s\n' "$version"
          test "${version##* }" = '2.12.2'
      - name: Cache native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - name: Build complete native Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.sha }}
          path: |
            dist/native-win/app/
            dist/native-win/Brevia-*-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Test native host
        run: cargo test --release --locked --manifest-path macos/host/Cargo.toml
      - name: Test real WebView2 and PDF export
        run: node macos/host/smoke.cjs dist/native-win/app
      - name: Test upgrade from the last Electron release
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node windows/test-upgrade.cjs "dist/native-win/Brevia-$version-x64-setup.exe"
      - uses: actions/cache@v4
        with:
          path: dist/native-smoke-models
          key: native-models-v1-${{ hashFiles('backend/models.json') }}
      - name: Validate real ASR, VAD, voiceprints and translation
        run: |
          node scripts/prepare-native-smoke.cjs dist/native-smoke-models
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $modelPath = 'dist/中文用户 模型'
          Move-Item dist/native-smoke-models $modelPath
          try {
            node macos/inference/smoke.cjs $modelPath dist/native-win/app/resources/engines
            if ($LASTEXITCODE) { throw 'Native model smoke failed' }
          } finally {
            Move-Item $modelPath dist/native-smoke-models
          }
