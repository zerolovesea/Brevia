name: Native Windows validation

on:
  workflow_dispatch:
  pull_request:
    paths: &native-windows-paths
      - 'windows/**'
      - 'macos/*.cjs'
      - 'macos/*.js'
      - 'macos/backend/**'
      - 'macos/host/**'
      - 'macos/inference/*.cpp'
      - 'macos/inference/*.h'
      - 'macos/inference/opus-stereo.patch'
      - 'macos/inference/*.cjs'
      - 'backend/**'
      - 'desktop/**'
      - 'frontend/**'
      - 'skills/brevia/**'
      - 'scripts/**'
      - '.github/actions/bundled-vad/**'
      - 'package*.json'
      - '.github/workflows/windows-backend.yml'
      - '.github/workflows/release.yml'
      - '!windows/**/*.md'
      - '!macos/**/*.md'
      - '!desktop/**/*.md'
      - '!frontend/**/*.md'
      - '!backend/**/*.md'
      - '!scripts/**/*.md'
      - '!scripts/test-website-demos.cjs'
      - '!scripts/analyze_website_globals.mjs'
      - '!scripts/update-release-links.mjs'
      - '!macos/host/src/appkit.m'
      - '!macos/host/Info.plist'
      - '!macos/host/cargo.sh'
      - '!scripts/ci-mobile-changes.py'
      - '!scripts/test-ci-mobile-changes.py'
  push:
    branches: [main]
    paths: *native-windows-paths

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Identify native cache image
        id: native-cache-image
        shell: bash
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      # 只缓存编译依赖；安装包、签名材料及宿主最终可执行文件不进入缓存。
      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: |
            dist/native-win/sources
            dist/native-win/build
            macos/host/target/release/deps/*
            macos/host/target/release/build
            macos/host/target/release/.fingerprint
            ~/.cargo/registry
            !macos/host/target/release/deps/brevia_host-*
          key: native-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-image.outputs.version }}-${{ hashFiles('.github/workflows/native-macos.yml', '.github/workflows/windows-backend.yml', '.github/workflows/release.yml', 'macos/host/Cargo.lock', 'macos/inference/Package.swift', 'macos/inference/Package.resolved', 'macos/inference/build.sh', 'macos/inference/*.patch', 'windows/build.cjs', 'windows/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            native-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-image.outputs.version }}-${{ hashFiles('.github/workflows/native-macos.yml', '.github/workflows/windows-backend.yml', '.github/workflows/release.yml', 'macos/host/Cargo.lock', 'macos/inference/Package.swift', 'macos/inference/Package.resolved', 'macos/inference/build.sh', 'macos/inference/*.patch', 'windows/build.cjs', 'windows/CMakeLists.txt') }}-
      - uses: ./.github/actions/bundled-vad
      - name: Restore native bundler
        id: tauri-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - name: Install native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Verify native bundler
        shell: bash
        run: |
          version=$(cargo tauri --version)
          printf '%s\n' "$version"
          test "${version##* }" = '2.12.2'
      - name: Cache native bundler
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.2
      - name: Build complete native Windows installer
        id: native-build
        run: npm run dist:win
      - name: Upload native packaging diagnostics
        if: failure() && steps.native-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnostic-${{ github.sha }}
          path: |
            dist/native-win/app/
            macos/host/target/release/Brevia.exe
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.sha }}
          path: |
            dist/native-win/app/
            dist/native-win/Brevia-*-x64-setup.exe
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Test native host
        run: cargo test --release --locked --manifest-path macos/host/Cargo.toml
      - name: Test real WebView2 and PDF export
        run: node macos/host/smoke.cjs dist/native-win/app
      - name: Test upgrade from the last Electron release
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node windows/test-upgrade.cjs "dist/native-win/Brevia-$version-x64-setup.exe"
      - name: Restore verified smoke models
        id: smoke-models-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/native-smoke-models
          key: native-models-v1-${{ hashFiles('backend/models.json') }}
      - name: Prepare verified smoke models
        run: node scripts/prepare-native-smoke.cjs dist/native-smoke-models
      - name: Cache verified smoke models
        if: steps.smoke-models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/native-smoke-models
          key: native-models-v1-${{ hashFiles('backend/models.json') }}
      - name: Validate real ASR, VAD, voiceprints and translation
        run: |
          $modelPath = 'dist/中文用户 模型'
          $enginePath = 'dist/中文安装 引擎'
          Move-Item dist/native-smoke-models $modelPath
          try {
            Copy-Item dist/native-win/app/resources/engines $enginePath -Recurse
            node macos/inference/smoke.cjs $modelPath $enginePath
            if ($LASTEXITCODE) { throw 'Native model smoke failed' }
          } finally {
            Move-Item $modelPath dist/native-smoke-models
            if (Test-Path $enginePath) { Remove-Item $enginePath -Recurse -Force }
          }
