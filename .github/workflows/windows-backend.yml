name: Windows backend validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-backend.yml'
  push:
    branches: ['codex/windows-backend-redesign']

permissions:
  contents: read

concurrency:
  group: windows-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      BREVIA_SKIP_E2E: '1'
      BREVIA_ASR_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build the supported CPU runtime
        env:
          CMAKE_ARGS: >-
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON
            -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF
            -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF
        run: python -m pip install --no-binary=llama-cpp-python --no-cache-dir -r backend/requirements-build.txt -r requirements-dev.txt
      - run: npm run format:check
      - run: npm run lint:python
      - run: npm test
      - name: Freeze the actual Windows entry points
        run: python backend/pack_worker.py
      - name: Verify native models and process entry points
        run: python backend/diagnose_windows_bundle.py --runtime backend/runtime
      - name: Measure cold entries and process-tree resources
        run: >-
          python -m backend.bench_diarization
          --worker backend/runtime/brevia-worker/brevia-worker.exe
          --wav backend/fixtures/example-zh.wav
          --models-root backend/bundled-models
          --output-dir artifacts/cold-entry
          --repeat 3 --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-backend-diagnostics-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-backend-runtime-${{ github.sha }}
          path: |
            backend/runtime/brevia-worker/
            backend/bundled-models/
            backend/fixtures/
          if-no-files-found: error
          retention-days: 7
